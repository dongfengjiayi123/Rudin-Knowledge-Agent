[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rudin-knowledge-agent"
version = "0.1.0"
description = "Local Rudin knowledge graph, evidence-grounded agent and MCP server"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pymupdf>=1.24,<2", "python-dotenv>=1,<2", "mcp>=1.28,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
rudin = "rudin_agent.cli:main"

[tool.setuptools]
packages = ["rudin_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
